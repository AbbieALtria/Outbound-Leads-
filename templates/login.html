<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Lead Gen Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Lead Gen Platform</h1>
      <p class="dim small">Sign in to continue</p>
      {% if error %}<p class="pull-result err">{{ error }}</p>{% endif %}
      <form method="post" class="login-form">
        <label>Username<input type="text" name="username" autofocus required></label>
        <label>Password<input type="password" name="password" required></label>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </div>
  </div>
</body>
</html>
