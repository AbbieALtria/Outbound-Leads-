{% extends "base.html" %}
{% block title %}Change password — Lead Gen Platform{% endblock %}
{% block content %}

<section class="card" style="max-width:460px;">
  <h2>Change your password</h2>
  {% if forced %}
  <p class="warn">🔒 For security, please set your own password before you continue.</p>
  {% endif %}
  {% if error %}<p class="pull-result err">{{ error }}</p>{% endif %}
  <form method="post" class="u-edit-form" style="flex-direction:column;align-items:stretch;gap:10px;">
    <label class="dim small">New password
      <span class="pw-wrap" style="display:block;">
        <input type="password" name="password" required minlength="6" style="width:100%;" autofocus>
        <button type="button" class="pw-eye" tabindex="-1" aria-label="Show password">👁</button>
      </span>
    </label>
    <label class="dim small">Confirm new password
      <span class="pw-wrap" style="display:block;">
        <input type="password" name="password2" required minlength="6" style="width:100%;">
        <button type="button" class="pw-eye" tabindex="-1" aria-label="Show password">👁</button>
      </span>
    </label>
    <button type="submit" class="primary">Set password</button>
  </form>
</section>

{% endblock %}
