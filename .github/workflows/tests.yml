name: tests

# Runs the pytest suite on every push and pull request. No secrets: every
# paid provider (Outscraper, Apollo, Anthropic, the email verifier) is mocked,
# and tests/conftest.py blocks outbound network access outright.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same interpreter the app declares in .python-version (Railway reads it too).
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests -q
